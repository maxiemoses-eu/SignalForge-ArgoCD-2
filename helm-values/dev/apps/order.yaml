cluster: "https://kubernetes.default.svc"
namespace: "signalforge-dev"
image:
  repository: "signalforge.azurecr.io/order"
  tag: "v1.0.0"

startupProbe:
  httpGet:
    path: /healthz
    port: 8080
  failureThreshold: 20 
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080