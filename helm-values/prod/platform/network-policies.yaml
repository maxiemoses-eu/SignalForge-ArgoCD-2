# 1. THE LOCKDOWN: Deny all traffic by default in PROD
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-default-deny
  namespace: signalforge-prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]

---
# 2. THE COLLECTOR: Allow Fluent Bit to send logs/metrics
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-fluentbit-egress
  namespace: signalforge-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: loki}}}]
    ports: [{protocol: TCP, port: 3100}]
  - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}}]
    ports: [{protocol: TCP, port: 9090}]
  - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}] # DNS
    ports: [{protocol: UDP, port: 53}]

---
# 3. THE VAULT: Allow Loki HA to talk to Azure Storage
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prod-loki-storage-egress
  namespace: signalforge-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: loki
  policyTypes: [Egress]
  egress:
  - to: [{ipBlock: {cidr: 0.0.0.0/0}}] # Azure Storage (Best via Private Endpoint)
    ports: [{protocol: TCP, port: 443}]