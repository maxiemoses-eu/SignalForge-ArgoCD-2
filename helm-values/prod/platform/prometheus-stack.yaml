# SignalForge 2026: Production High-Availability (Prometheus)
prometheus:
  prometheusSpec:
    replicas: 2 
    retention: 30d 
    retentionSize: "90GB" # Safety cap to prevent disk overflow
    
    # 2026 Best Practice: Ensure replicas are in different Azure Availability Zones
    podAntiAffinity: "hard"

    storageSpec:
      volumeClaimTemplate:
        spec:
          # FIXED: Swapped 'gp3' (AWS) for 'managed-csi' (Azure)
          storageClassName: "managed-csi" 
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 100Gi

    # Global Labels for Multi-Cluster Visibility
    externalLabels:
      cluster: signalforge-prod
      region: primary-west
      provider: azure

# 2026 PROD Alerting: Multi-Channel Routing
alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack-notifications'
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL} # Injected from Secret
        channel: '#signalforge-alerts'
        send_resolved: true

grafana:
  enabled: true
  persistence:
    enabled: true
    storageClassName: "managed-csi"