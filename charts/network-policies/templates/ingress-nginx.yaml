# Allow the ingress-nginx controller to route external traffic into this namespace.
# ingressNamespace is set in values.yaml and overridable per environment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "network-policies.labels" . | nindent 4 }}
spec:
  podSelector: {} # Targets all pods (Gateway, Payment, etc.)
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingressNamespace }}
      ports:
        # 2026 Loop: Automatically opens 5003 and 8080 based on our values.yaml
        {{- range .Values.appPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}