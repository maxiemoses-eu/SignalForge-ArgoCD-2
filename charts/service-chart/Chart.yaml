apiVersion: v2
name: service-chart
description: >-
  Generic reusable Helm chart for all SignalForge microservices.
  Service-specific config lives entirely in helm-values/{env}/apps/{service}.yaml.
  This chart is never modified per-service — only values files change.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - signalforge
  - microservice
  - watertight-security
  - gitops
maintainers:
  - name: platform-team
    email: platform@signalforge.io
annotations:
  # SignalForge 2026: Mark as a Protected Base Template
  signalforge.io/template-status: immutable
  signalforge.io/security-level: hardened