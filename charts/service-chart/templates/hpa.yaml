{{- if .Values.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "service-chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "service-chart.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # CPU Scaling: Good for processing spikes
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 80 }}
    # Memory Scaling: Critical for Go services under load
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
  
  # 2026 BEHAVIOR: Prevents "Flapping"
  behavior:
    scaleDown:
      # Wait 5 minutes before scaling down to ensure the spike is actually over
      stabilizationWindowSeconds: 300 
      policies:
        - type: Percent
          value: 10 # Scale down slowly (10% of pods at a time)
          periodSeconds: 60
    scaleUp:
      # React quickly to traffic bursts
      stabilizationWindowSeconds: 0 
      policies:
        - type: Pods
          value: 2 # Add 2 pods at a time
          periodSeconds: 15
{{- end }}